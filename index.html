<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1e">
  <meta name="description" content="Smart GPS Cattle Collar - Real-time livestock tracking and geofence monitoring">
  <title>CattleGuard Pro • Live Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css?v=10.0.0">
</head>
<body>

  <div class="app-wrap">

    <!-- TOP HEADER -->
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="app-icon">🐄</span>
        <div>
          <h1 class="app-title">CattleGuard <span class="pro-badge">PRO</span></h1>
          <p class="app-sub" id="lbl-ip-info">Enter collar IP below to connect…</p>
        </div>
      </div>
      <div class="top-bar-right">
        <!-- Device On/Off Pill -->
        <div class="device-pill offline" id="device-pill">
          <span class="pulse-dot" id="pulse-dot"></span>
          <span id="status-text">SEARCHING</span>
        </div>
        <button class="icon-btn" id="btn-sound-toggle" title="Toggle Alarm">
          <span id="sound-icon">🔔</span>
        </button>
      </div>
    </header>

    <!-- MAP -->
    <div class="map-wrap">
      <div id="map"></div>

      <!-- Floating map action buttons -->
      <div class="map-fab-group">
        <button class="fab-btn" id="btn-sync-phone" title="Center on My Location">📍</button>
        <button class="fab-btn" id="btn-lock-cow" title="Find Cow">🐄</button>
        <button class="fab-btn" id="btn-gmaps" title="Open in Google Maps">🗺️</button>
      </div>
    </div>

    <!-- BOTTOM PANEL -->
    <section class="bottom-panel">

      <!-- 1. Geofence Alert Banner -->
      <div class="alert-card safe" id="geofence-banner">
        <div class="alert-icon" id="banner-icon">🟢</div>
        <div class="alert-body">
          <strong class="alert-title" id="banner-title">SAFE IN PASTURE</strong>
          <span class="alert-desc" id="banner-desc">Collar within perimeter</span>
        </div>
        <div class="alert-dist" id="badge-distance">-- m</div>
      </div>

      <!-- 2. Stats Row -->
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-label">LATITUDE</span>
          <span class="stat-val mono" id="val-lat">--°</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">LONGITUDE</span>
          <span class="stat-val mono" id="val-lng">--°</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">SPEED</span>
          <span class="stat-val" id="val-speed">-- km/h</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">FIX TYPE</span>
          <span class="stat-val" id="val-status">--</span>
        </div>
      </div>

      <!-- 3. Boundary Slider -->
      <div class="boundary-card">
        <div class="boundary-header">
          <span>🛡️ Safe Boundary Radius</span>
          <span class="radius-val" id="radius-display">15 m</span>
        </div>
        <input type="range" id="radius-slider" min="5" max="150" value="15" step="1" class="slider-full">
      </div>

      <!-- 4. ESP IP Connect Bar -->
      <div class="boundary-card" id="ip-input-wrap">
        <div class="boundary-header">
          <span>📡 Collar IP Address</span>
          <span style="font-size:11px;color:#64748b;">from Serial Monitor</span>
        </div>
        <div style="display:flex;gap:8px;margin-top:6px;">
          <input id="input-esp-ip" type="text" placeholder="e.g. 192.168.43.155"
            style="flex:1;background:#1e293b;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:9px 12px;font-size:14px;outline:none;" />
          <button id="btn-ip-connect"
            style="background:#06b6d4;color:#000;font-weight:700;border:none;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer;">CONNECT</button>
        </div>
      </div>

    </section>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js?v=10.0.0"></script>
</body>
</html>
