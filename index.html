<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Smart Cattle GPS Collar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<!-- Leaflet Map CSS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="mobile-app">
  <!-- Clean Top Bar -->
  <header class="top-bar">
    <div class="brand">
      <span class="logo-emoji">🐄</span>
      <div>
        <h1>Cattle Live Tracker</h1>
        <p class="subtitle">Smart GPS &amp; Geofence Collar</p>
      </div>
    </div>
    <div class="status-pill status-offline" id="collar-status">
      <span class="pulse-dot"></span>
      <span id="status-text">CONNECTING...</span>
    </div>
  </header>

  <!-- Real-Time Geofence Alert Card -->
  <div class="alert-card safe" id="alert-card">
    <div class="alert-main">
      <div class="alert-icon" id="alert-icon">🟢</div>
      <div class="alert-info">
        <h2 id="alert-title">SAFE: INSIDE PASTURE</h2>
        <p id="alert-desc">Distance from Farmer: <span class="highlight" id="val-dist">0.0 m</span> &bull; Limit: <span id="val-limit">15.0 m</span></p>
      </div>
    </div>
    <div class="alert-options">
      <label class="sound-switch">
        <input type="checkbox" id="chk-sound" checked>
        <span>🔊 Alarm</span>
      </label>
    </div>
  </div>

  <!-- Full Leaflet Map View -->
  <div class="map-wrapper">
    <div id="map"></div>
    
    <!-- Floating Map Controls -->
    <div class="map-floating-controls">
      <button id="btn-my-loc" class="btn-float" title="Set Boundary to Phone GPS">
        📍 Center on My Location
      </button>
      <button id="btn-recenter-cow" class="btn-float btn-secondary" title="Center on Cow">
        🐄 Find Cow
      </button>
    </div>
  </div>

  <!-- Quick Range Controller & Telemetry -->
  <section class="bottom-panel">
    <div class="control-row">
      <div class="range-selector">
        <label for="range-input">🛡️ Boundary Range:</label>
        <div class="input-unit">
          <input type="number" id="range-input" value="15" min="5" max="500" step="1">
          <span>meters</span>
        </div>
      </div>
      <a id="btn-gmaps" href="#" target="_blank" class="btn-gmaps">
        ↗ Google Maps
      </a>
    </div>

    <!-- Minimal Clean Telemetry (No Signal Strength) -->
    <div class="telemetry-row">
      <div class="metric">
        <span class="m-label">LATITUDE</span>
        <span class="m-val mono" id="t-lat">--</span>
      </div>
      <div class="metric">
        <span class="m-label">LONGITUDE</span>
        <span class="m-val mono" id="t-lng">--</span>
      </div>
      <div class="metric">
        <span class="m-label">SPEED</span>
        <span class="m-val mono" id="t-spd">0.0 km/h</span>
      </div>
      <div class="metric">
        <span class="m-label">COLLAR POSITION</span>
        <span class="m-val mono" id="t-fix">TRACKING</span>
      </div>
    </div>
  </section>
</div>

<!-- Leaflet Map JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
